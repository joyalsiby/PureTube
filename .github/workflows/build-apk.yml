name: Build & Release PureTube APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract App Version from build.gradle.kts
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "apk_name=PureTube-v${VERSION_NAME}.apk" >> $GITHUB_OUTPUT
          echo "Detected PureTube v${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Normalize and make gradlew executable
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK to Match Version Number
        run: |
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.version.outputs.apk_name }}"

      - name: Upload Versioned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureTube-v${{ steps.version.outputs.version_name }}
          path: ${{ steps.version.outputs.apk_name }}

      - name: Create GitHub Release (on v* tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "PureTube v${{ steps.version.outputs.version_name }}"
          body: |
            ### PureTube `v${{ steps.version.outputs.version_name }}` (`versionCode = ${{ steps.version.outputs.version_code }}`)
            - **Direct APK Download:** Attach & install `${{ steps.version.outputs.apk_name }}` below.
            - **In-Place Upgrade Ready:** Signed with the project's persistent keystore so you can install directly over previous versions (or update via the in-app Updater) without losing watch history.
            - See [`PROJECT_LOG.md`](https://github.com/${{ github.repository }}/blob/main/PROJECT_LOG.md) for full changelog details.
          files: |
            ${{ steps.version.outputs.apk_name }}
          generate_release_notes: true
